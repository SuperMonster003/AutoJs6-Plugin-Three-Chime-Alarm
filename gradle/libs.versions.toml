[versions]

# Roadmap T22: the Compose 1.12 line of 3-Macaw Speech (compileSdk 37, AGP 9.1.1+); the BOM is the single Compose version source.
compose-bom = "2026.09.00"
# The Compose BOM does not manage androidx.activity; the activity line 3-Macaw Speech ships with the same BOM.
activity-compose = "1.12.2"
core-ktx = "1.15.0"
# Roadmap T47: core library desugaring (java.time on API 24 / 25), the release of the host and 3-Stamp Mail.
desugar = "2.1.5"
foojay-resolver-convention = "1.0.0"
junit = "4.13.2"
kotlinx-coroutines-android = "1.11.0"
# Roadmap T10: RRULE evaluation (Apache-2.0, pure Java, with rfc5545-datetime 0.3 and jems2 2.23.1).
lib-recur = "0.17.1"
# The MIT Kotlin port of Material Color Utilities of the Three plugins: the HCT tone rule of the theme accent (roadmap T22).
material-color-utilities = "4.1.1"
# The test library line of 3-Macaw Speech: Espresso 3.5.0 calls InputManager.getInstance, gone on API 36.
test-espresso-core = "3.7.0"
test-junit-version = "1.3.0"
test-rules = "1.7.0"
test-runner = "1.7.0"

[libraries]

compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines-android" }
lib-recur = { module = "org.dmfs:lib-recur", version.ref = "lib-recur" }
material-color-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "material-color-utilities" }
test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "test-espresso-core" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit-version" }
test-rules = { module = "androidx.test:rules", version.ref = "test-rules" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }

[plugins]

foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver-convention" }
